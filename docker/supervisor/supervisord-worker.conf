[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; The jobs set their own tries/backoff (contact-form emails: 5 attempts at
; 1, 5, 15, 60 minutes). --tries/--backoff here only cover jobs that don't
; (password reset). --timeout must stay below DB_QUEUE_RETRY_AFTER (90).
; --max-time restarts the process hourly; supervisor brings it back.
[program:queue-work]
command=php /var/www/html/artisan queue:work database --sleep=%(ENV_QUEUE_SLEEP)s --tries=3 --backoff=60 --timeout=60 --memory=128 --max-time=3600
user=www-data
directory=/var/www/html
autorestart=true
startsecs=0
stopwaitsecs=70
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:schedule-work]
command=php /var/www/html/artisan schedule:work
user=www-data
directory=/var/www/html
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
