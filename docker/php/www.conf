[www]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data

; Render's environment variables must reach the PHP workers (the config
; cache is built from them in the entrypoint).
clear_env = no

; Every request holds at most one database connection, so max_children is
; the web service's connection ceiling. See docs/render.md "Connection budget".
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
