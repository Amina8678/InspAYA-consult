; Matches nginx client_max_body_size 14M and the media library limits
; (10 MB PDFs, 5 MB images). PHP's defaults would reject them first.
upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
expose_php = Off

; The image is immutable: files never change after the build, so skip the
; per-request stat() calls. A new deploy is a new container.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
