user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Render's router connects over plain HTTP and sets X-Forwarded-Proto.
    # Never build redirects from $scheme or the listen port.
    absolute_redirect off;
    port_in_redirect off;

    # Basic auth is skipped for the health probe (the entrypoint only emits
    # the auth_basic directives when BASIC_AUTH_USER/PASSWORD are set).
    map $request_uri $auth_realm {
        default "Restricted";
        ~^/up(\?.*)?$ "off";
    }

    include /etc/nginx/conf.d/*.conf;
}
