# Render blueprint: web + worker from one Docker image. Neon Postgres is
# external (no database here) and there is no cron service: the worker runs
# `schedule:work`. Walkthrough: docs/render.md.
#
# Secrets cannot be declared in an environment group (Render rejects
# `sync: false` there). Add them once to the `inspaya-shared` group in the
# dashboard after the first sync: APP_KEY, APP_URL, DB_HOST, DB_DATABASE,
# DB_USERNAME, DB_PASSWORD, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM_ADDRESS,
# SUPER_ADMIN_* (see .env.render.example).

envVarGroups:
  - name: inspaya-shared
    envVars:
      - key: APP_NAME
        value: InspAya Consult
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"

services:
  - type: web
    name: inspaya-web
    runtime: docker
    region: frankfurt
    plan: starter            # persistent disks need a paid plan
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    # Migrations run in a one-off container before the new version takes
    # traffic. Seeding is never run here: see docs/render.md.
    preDeployCommand: php artisan migrate --force
    disk:
      name: inspaya-uploads
      mountPath: /var/www/html/storage/app/public
      sizeGB: 1
    envVars:
      - fromGroup: inspaya-shared
      - key: APP_ROLE
        value: web
      # Staging only: set in the dashboard, never here.
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: STAGING_NOINDEX
        value: "0"
      - key: PHP_FPM_MAX_CHILDREN
        value: "8"

  - type: worker
    name: inspaya-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: inspaya-shared
      - key: APP_ROLE
        value: worker
      - key: QUEUE_SLEEP
        value: "3"
